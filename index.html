<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rimessa in forma</title>
<meta name="description" content="Il programma di rimessa in forma: giorni, schede esercizio, ritmo guidato, timer di tenute e recupero, note, fastidi e progressi.">
<meta name="theme-color" content="#ECEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Rimessa in forma<small id="hdr-sub">Settimana 1 · Rientro</small></div>
    <div class="save" id="save"><i></i><span>Caricamento</span></div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-oggi" aria-label="Oggi"></section>
  <section class="view" id="v-diario" aria-label="Diario" hidden></section>
  <section class="view" id="v-progressi" aria-label="Progressi" hidden></section>
  <section class="view" id="v-impostazioni" aria-label="Impostazioni" hidden></section>
</main>

<div id="rest" hidden>
  <div class="rb" id="rb">
    <div class="rb-fill" id="rb-fill"></div>
    <div class="rb-row">
      <p class="rb-lab" id="rb-lab">Recupero</p>
      <p class="rb-time" id="rb-time">0:00</p>
      <p class="rb-next" id="rb-next"></p>
      <div class="rb-btns">
        <button type="button" id="rb-minus">−15 s</button>
        <button type="button" id="rb-plus">+15 s</button>
        <button type="button" id="rb-skip">Salta</button>
      </div>
    </div>
  </div>
</div>

<div id="coach" hidden>
  <div class="co" id="co" role="dialog" aria-label="Esecuzione guidata">
    <div class="co-top">
      <div><p class="co-ex" id="co-ex"></p><p class="co-sub" id="co-sub"></p></div>
      <button type="button" class="btn sm ghost" id="co-min">Riduci</button>
    </div>
    <p class="co-phase" id="co-phase" aria-live="polite"></p>
    <p class="co-big" id="co-big">0</p>
    <div class="co-bar"><i id="co-bar"></i></div>
    <p class="co-count" id="co-count"></p>
    <div class="co-acts" id="co-acts"></div>
  </div>
</div>

<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<nav class="tabs" aria-label="Sezioni">
  <div class="wrap">
    <button type="button" data-view="oggi" aria-current="page"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>Oggi</button>
    <button type="button" data-view="diario"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Diario</button>
    <button type="button" data-view="progressi"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M5 15l4-4 4 3 6-7"/></svg>Progressi</button>
    <button type="button" data-view="impostazioni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Impostazioni</button>
  </div>
</nav>

<script src="app.js"></script>
</body>
</html>
